[project]
id = "deflate"
version = "0.1.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the library, what a dependent's `use deflate;` binds
[artifact.deflate]
kind = "static"
default = true
entry = "lib/deflate.mach"
out = "{project.work}/lib/deflate"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
